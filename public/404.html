<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada • 11FUT MANAGER</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06080b;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card-404 {
      background: rgba(14, 18, 26, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .badge-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 72px;
      font-weight: 900;
      color: #e21e22;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px;
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-home {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(180deg, #e5be3a, #8a6e1a);
      color: #000;
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
    }
    .btn-home:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card-404">
    <div class="badge-code">404</div>
    <h1>Fuera de Juego</h1>
    <p>La jugada o página que estás buscando no existe o fue movida a otra posición táctica.</p>
    <a href="/" class="btn-home">⚽ Volver a la Cancha</a>
  </div>
</body>
</html>
